<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:N;src:url(../../assets/fonts/NotoSansSC-Regular.otf)}@font-face{font-family:N;font-weight:700;src:url(../../assets/fonts/NotoSansSC-Bold.otf)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:N,sans-serif;background:linear-gradient(135deg,#2f6be6 0%,#4a8ff0 55%,#5aa9ff 100%);color:#fff;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box;position:relative}
.icon{width:260px;height:260px;border-radius:58px;background:url(../../web/icons/Icon-maskable-512.png) center/128% no-repeat;box-shadow:0 18px 40px rgba(10,40,120,.35);flex:none}
h1{white-space:nowrap;font-size:58px;font-weight:700;margin:0 0 14px;letter-spacing:1px;line-height:1.1}
p{white-space:nowrap;font-size:28px;margin:0;line-height:1.45;opacity:.95}
.chips{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.chips span{font-size:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 18px}
</style></head><body><div class="icon"></div><div>
<h1 id="t"></h1><p id="s"></p><div class="chips" id="c"></div></div>
<script>
const L={zh:{t:'学校通 · SchoolSift',s:'学校通知变成家庭日程<br>签字、缴费、带东西,到期前提醒',c:['日程','签字','缴费','成绩','家庭同步']},
en:{t:'SchoolSift',s:'School notices → family calendar<br>Reminders for forms, fees &amp; due dates',c:['Calendar','Forms','Fees','Grades','Family']}};
const l=L[new URLSearchParams(location.search).get('l')||'zh'];
t.textContent=l.t;s.innerHTML=l.s;c.innerHTML=l.c.map(x=>'<span>'+x+'</span>').join('');
</script></body></html>
