# 把 Flutter Web 版部署到 GitHub Pages。
#
# 推 main 就自动:装 Flutter → 构建 Web(release)→ 把隐私政策一起放进去 → 发布。
# 站点地址形如 https://<组织>.github.io/<仓库名>/,所以 base-href 取仓库名。
#
# 首次需要在仓库 Settings → Pages 把 Source 设为 "GitHub Actions"(或用
# `gh api repos/<owner>/<repo>/pages -X POST -f build_type=workflow`),之后不用再管。

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'   # 与本机一致;升级时同步改
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        # --no-web-resources-cdn:CanvasKit 引擎和 Roboto 回退字体从本站加载,不再依赖 www.gstatic.com /
        #   fonts.gstatic.com(连不上时 CDN 版直接白屏;代价是首访多下约 0.56–0.69 MB)。
        # FEEDBACK_FORM_URL:仓库变量(Settings → Secrets and variables → Actions → Variables),
        #   「用英文回复」反馈卡的表单地址;没设时反馈卡只提供「复制反馈」。见 app/lib/core/reply_feedback.dart。
        #   地址里有 & { },经环境变量加引号传入,不直接拼进命令。
        env:
          FEEDBACK_FORM_URL: ${{ vars.FEEDBACK_FORM_URL }}
        run: >-
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define="FEEDBACK_FORM_URL=$FEEDBACK_FORM_URL"

      - name: Bundle privacy policy alongside the app
        run: cp ../docs/privacy-policy.html ../docs/delete-account.html build/web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
